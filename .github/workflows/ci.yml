name: CI

on:
  push:
  pull_request:
  # a release chama este workflow no commit da tag e so publica com tudo verde
  workflow_call:

permissions:
  contents: read

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "pydantic>=2.6" "defusedxml>=0.7.1" "cryptography>=42" "keyring>=25" "pytest>=8"
      # a trava usa msvcrt no Windows e fcntl no Linux e no macOS: a matriz prova os dois caminhos
      - run: python -m pytest -q

  cheques:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # o registro da chamada do schtasks e um ast.dump do Python 3.12; outra versao falha fechada
          python-version: "3.12"
      - name: so o engine/adn.py usa rede, e o agendar so chama o schtasks registrado
        run: python ferramentas/checar_sem_rede.py . --ferramenta capturador-de-notas
      - name: a saida nunca traz texto de nota (so o codigo que vai no zip)
        run: |
          set -euo pipefail
          cod="$(mktemp -d)"
          cp -R capturador.py engine pyproject.toml "$cod/"
          python ferramentas/checar_saida_sem_dado.py "$cod"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: baixar e conferir o gitleaks v8.30.1
        run: |
          set -euo pipefail
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --ignore-missing -c gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks
      - run: ./gitleaks git . -v
      - run: ./gitleaks dir . -v
